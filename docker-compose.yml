services:
  postgres:
    image: postgres:17
    container_name: poultry-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poultry_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-poultry_management}

    ports:
      - "5432:5432"

    volumes:
      - poultry_postgres_data:/var/lib/postgresql/data

volumes:
  poultry_postgres_data: